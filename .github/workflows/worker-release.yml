name: Publish CRS Worker

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Worker version in WorkerVersion.props (for example 2.0.1)'
        required: true
      upgrade_from:
        description: 'Comma-separated, verified source versions (for example 2.0.0)'
        required: true

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore CRS.sln --locked-mode
      - name: Build Worker package
        shell: pwsh
        run: |
          $engine = Join-Path $env:RUNNER_TEMP 'mihomo-windows-amd64-compatible-v1.19.34.zip'
          Invoke-WebRequest -Uri 'https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-windows-amd64-compatible-v1.19.34.zip' -OutFile $engine
          ./tests/Publish-BackgroundService.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'worker') -MihomoArchive $engine
      - uses: actions/upload-artifact@v4
        with:
          name: worker-package
          path: ${{ runner.temp }}/worker
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: package
    runs-on: windows-latest
    environment: worker-release
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: worker-package
          path: ${{ runner.temp }}/worker
      - name: Sign the Worker manifest and create the release asset
        shell: pwsh
        env:
          WORKER_VERSION: ${{ inputs.version }}
          WORKER_UPGRADE_FROM: ${{ inputs.upgrade_from }}
          WORKER_RELEASE_PFX_BASE64: ${{ secrets.WORKER_RELEASE_PFX_BASE64 }}
          WORKER_RELEASE_PFX_PASSWORD: ${{ secrets.WORKER_RELEASE_PFX_PASSWORD }}
        run: |
          if(-not $env:WORKER_RELEASE_PFX_BASE64){throw 'The protected Worker signing certificate is required.'}
          $key=[Convert]::FromBase64String($env:WORKER_RELEASE_PFX_BASE64)
          try {
            $certificate=[Security.Cryptography.X509Certificates.X509CertificateLoader]::LoadPkcs12(
              $key,$env:WORKER_RELEASE_PFX_PASSWORD,[Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
            try {
              ./tools/background/New-WorkerGitHubRelease.ps1 -PackageDirectory (Join-Path $env:RUNNER_TEMP 'worker') `
                -ExpectedVersion $env:WORKER_VERSION -UpgradeFromVersions ($env:WORKER_UPGRADE_FROM.Split(',').Trim()) `
                -Certificate $certificate -OutputDirectory (Join-Path $env:RUNNER_TEMP 'release')
            } finally { $certificate.Dispose() }
          } finally { [Array]::Clear($key) }
      - name: Publish the signed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_VERSION: ${{ inputs.version }}
        run: |
          $tag='worker-v'+$env:WORKER_VERSION
          $asset=Join-Path $env:RUNNER_TEMP 'release/CRS.Worker.Service-win-x64.zip'
          gh release create $tag $asset --target $env:GITHUB_SHA --title "CRS Worker $env:WORKER_VERSION" --generate-notes --latest
          if($LASTEXITCODE -ne 0){throw 'GitHub did not publish the Worker release.'}
