name: Worker upgrade and recovery checks

on:
  pull_request:
    paths:
      - 'src/CRS.Worker.Service/**'
      - 'src/CRS.Common/**'
      - 'src/CRS.Worker.Ipc/**'
      - 'src/CRS.Worker.PluginHost/**'
      - 'src/CRS.Worker.PluginRunner/**'
      - 'src/CRS.Worker.Abstractions/**'
      - 'src/CRS.Security/**'
      - 'src/CRS.Infrastructure/**'
      - 'src/CRS.Notifications/**'
      - 'tools/background/**'
      - 'tests/CRS.Tests.Background/**'
      - 'tests/fixtures/CRS.Worker.FixturePlugin/**'
      - 'tests/Prepare-WorkerUpgradeFixture.ps1'
      - 'tests/Test-WorkerMaintenance.ps1'
      - 'tests/Test-WorkerUpgradeTransactions.ps1'
      - '.github/workflows/worker-upgrade-recovery-checks.yml'
      - 'Directory.Packages.props'
      - 'global.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-upgrade-recovery:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore Worker recovery tests
        run: dotnet restore tests/CRS.Tests.Background/CRS.Tests.Background.csproj
      - name: Build Worker recovery tests
        run: dotnet build tests/CRS.Tests.Background/CRS.Tests.Background.csproj -c Release --no-restore -m:1
      - name: Verify synthetic ServiceKey recovery envelope rejection matrix
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.Background -c Release --no-build -- --service-key-recovery
      - name: Verify data cleanup scope, retained rollback snapshots, restart and authenticated IPC
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.Background -c Release --no-build -- --data-cleanup
      - name: Verify storage growth above the former entry limit and fail-closed ACL checks
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.Background -c Release --no-build -- --storage-growth
      - name: Verify one-time recovery export authorization and audit failure boundary
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.Background -c Release --no-build -- --recovery-export-authorization
      # 真实加密索引和强杀重启仅证明本机授权持久化，不替代跨机恢复门槛。
      - name: Verify durable recovery authorization and process crash replay rejection
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.Background -c Release --no-build -- --recovery-export-persistence
      - name: Verify maintenance snapshot and C# startup interop
        shell: pwsh
        run: ./tests/Test-WorkerMaintenance.ps1 -CheckStartupInterop
      - name: Verify injected upgrade interruption and recovery matrix
        shell: pwsh
        run: ./tests/Test-WorkerUpgradeTransactions.ps1
      - name: Prepare isolated Worker process fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'worker-upgrade-fixture'
          ./tests/Prepare-WorkerUpgradeFixture.ps1 -Destination $fixture
      - name: Verify real Worker process startup and upgrade journal guard
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'worker-upgrade-fixture'
          & dotnet (Join-Path $fixture 'CRS.Tests.Background.dll') --upgrade-only $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Isolated Worker upgrade/startup regression failed.' }
      - name: Verify isolated storage maintenance runner and failure recovery
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'worker-upgrade-fixture'
          & dotnet (Join-Path $fixture 'CRS.Tests.Background.dll') --storage-migration-host $fixture (Join-Path $env:RUNNER_TEMP 'storage-migration-host')
          if ($LASTEXITCODE -ne 0) { throw 'Isolated storage maintenance regression failed.' }
