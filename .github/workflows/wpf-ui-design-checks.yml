name: WPF UI design checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  windows-ui:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Static design and plugin boundary checks
        shell: pwsh
        run: ./tests/Verify-WpfDesignSystem.ps1
      - name: Restore
        run: dotnet restore CRS.sln
      - name: Build release
        run: dotnet build CRS.sln -c Release --no-restore -m:1
      - name: Verify architecture dependency constraints
        shell: pwsh
        run: ./tests/Verify-Architecture.ps1
      - name: Verify atomic tax and performance import commits
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.Infrastructure -c Release --no-build -- --calculation-commit
      - name: Verify independent market query snapshots and writer isolation
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.NationalTeamWatch -c Release --no-build -- --read-isolation
      # 仓储必需能力与北京时间边界必须随源码改动回归，不能只验证接口能够编译。
      - name: Verify market repository contracts before job admission
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.NationalTeamWatch -c Release --no-build -- --repository-contracts
      - name: Verify equity comparison baselines and ETF collection receipts
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.NationalTeamWatch -c Release --no-build -- --evidence-adversarial
      - name: Verify storage provider capabilities in the formal plugin startup path
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.WorkerEtf -c Release --no-build -- --storage-providers
      - name: Verify application flows and Beijing business year boundary
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.Application -c Release --no-build
      - name: Verify supervised plugin fault isolation and durable execution
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.Background -c Release --no-build -- --supervised-plugins
      - name: Verify Worker abnormal execution filter before SQL pagination and via read-only IPC
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.Background -c Release --no-build -- --history-result-filter
      - name: Verify notification audit storage faults fail closed
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.Background -c Release --no-build -- --task-storage-boundary
      - name: Verify abandoned task-activity snapshot fairness and manual dispatch
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.Background -c Release --no-build -- --manual-immediate
      - name: Verify ETF market sync cooldown, empty downloads and job diagnostics
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.NationalTeamWatch -c Release --no-build -- --market-sync-diagnostics
      - name: Verify deterministic market cycle research and point-in-time gates
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.NationalTeamWatch -c Release --no-build -- --market-cycle-checks
      - name: Verify dashboard evidence scope and orphan fetch isolation
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.NationalTeamWatch -c Release --no-build -- --scoped-evidence
      # 只用隔离资料验证分页/取消，不在CI访问正式Worker或下载公开原件。
      - name: Verify adaptive ETF pages preserve complete snapshots and legacy clients
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.WorkerEtf -c Release --no-build -- --adaptive-query-pages
      - name: Verify bounded evidence verification cancellation and new corruption
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.WorkerEtf -c Release --no-build -- --raw-batch
      - name: Verify query cancellation preserves background collection
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.WorkerEtf -c Release --no-build -- --market-query-reliability
      - name: Verify paged query disconnect cancellation and old service fallback
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.WorkerEtf -c Release --no-build -- --query-cancellation
      - name: Verify ETF dashboard parity and late selection isolation
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.NationalTeamWatch -c Release --no-build -- --etf-loading
      - name: Verify plugin shared assembly same-version ABI mismatch is rejected before loading
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.PluginHost -c Release --no-build
      - name: Verify settings UI and synthetic credential lifecycle
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.Wpf -c Release --no-build -- --settings-ui "$env:GITHUB_WORKSPACE/artifacts/ui-preview/settings"
      - name: Verify global shell footer uses real Worker semantics and fail-closed health
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.Wpf -c Release --no-build -- --shell-status-checks
      - name: Verify footer direct navigation into recent executions and anomaly filtering
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.Wpf -c Release --no-build -- --task-center-deeplink-checks
      - name: Render main-window brand preview (synthetic)
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.Wpf -c Release --no-build -- --shell-brand-preview "$env:GITHUB_WORKSPACE/artifacts/ui-preview/main"
      - name: Render worker status health previews (synthetic)
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.Wpf -c Release --no-build -- --worker-status-preview "$env:GITHUB_WORKSPACE/artifacts/ui-preview/worker-status"
      - name: Render performance component previews (synthetic)
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.Wpf -c Release --no-build -- --performance-component-preview "$env:GITHUB_WORKSPACE/artifacts/ui-preview/performance"
      - name: Render plugin-management and virtualized-grid preview (synthetic)
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.Wpf -c Release --no-build -- --plugin-management-preview "$env:GITHUB_WORKSPACE/artifacts/ui-preview/plugin-management"
      - name: Render national-team plugin previews (synthetic)
        shell: pwsh
        run: dotnet run --project tests/CRS.Tests.PluginRecovery -c Release --no-build -- --ui-visual-preview "$env:GITHUB_WORKSPACE/artifacts/ui-preview/plugins"
      - name: Upload screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpf-ui-synthetic-previews
          path: artifacts/ui-preview/
          if-no-files-found: warn
          retention-days: 14
